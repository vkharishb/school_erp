# Continuous Integration (CI)
# Runs on every push and pull request: lint, type-check, build.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-build:
    name: Backend – Lint & Import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://schoolerp:test-only@db:5432/schoolerp_test
      SECRET_KEY: test-signing-key-for-ci-only-not-for-production-1234567890
      SUPER_ADMIN_USERNAME: ci-superadmin
      SUPER_ADMIN_EMAIL: ci-superadmin@schoolerp.test
      SUPER_ADMIN_PASSWORD: CiTest@2026!Strong

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit bandit

      - name: Ruff lint
        run: ruff check app tests --output-format=github

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Compile and import check
        run: |
          python -m compileall app tests
          python -c "from app.main import app; print('FastAPI app OK:', app.title)"

      - name: Python dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Backend static security audit
        run: bandit -r app -q --severity-level medium

  frontend-lint-and-build:
    name: Frontend – Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: NPM vulnerability audit
        run: npm audit --audit-level=high
        env:
          VITE_API_BASE_URL: /api/v1

  docker-compose-validate:
    name: Docker Compose – Config validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env for compose validate
        run: cp .env.example .env

      - name: Validate Neon and optional local-DB Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local-db.yml config --quiet
          mkdir -p certs && touch certs/schoolerp.crt certs/schoolerp.key
          docker compose -f docker-compose.yml -f docker-compose.lan-tls.yml config --quiet
