# Continuous Testing (CT)
# Runs against the shared Neon development database until environments are separated.

name: CT

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # One shared Neon Dev database is temporary; never run database suites concurrently.
  group: ct-neon-dev
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend – Pytest
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.NEON_DEV_DATABASE_URL }}
      SECRET_KEY: test-secret-key-for-ci-only-not-for-production
      APP_ENV: test
      DEBUG: "false"
      SUPER_ADMIN_EMAIL: superadmin@schoolerp.local
      SUPER_ADMIN_USERNAME: superadmin
      SUPER_ADMIN_PASSWORD: TestPassword123!
      SUPER_ADMIN_FULL_NAME: Test Super Admin
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Validate Neon development database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add NEON_DEV_DATABASE_URL in GitHub Actions secrets."
            exit 1
          fi

      - name: Run migrations
        run: alembic upgrade head

      - name: Bootstrap (super admin + modules)
        run: python -m app.scripts.bootstrap

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  frontend-smoke:
    name: Frontend – Build smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, type-check, and build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
