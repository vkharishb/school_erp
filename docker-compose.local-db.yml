services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-schoolerp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolerp} -d ${POSTGRES_DB:-schoolerp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-schoolerp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-schoolerp}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
